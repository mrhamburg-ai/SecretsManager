name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore

    - name: Check API compatibility
      run: |
        set -euo pipefail

        # Publish rather than build. A library build copies only the project's own assemblies, so
        # the checker would not find the NuGet dependencies it needs to resolve the API surface.
        dotnet publish tools/ApiCompatChecker/ApiCompatChecker.csproj -c Release -o "$RUNNER_TEMP/api-checker"
        dotnet publish src/SecretsManager.Vault/SecretsManager.Vault.csproj -c Release -o "$RUNNER_TEMP/api-current"

        # The base has to be origin/main, built in an isolated worktree. Comparing the branch
        # against its own output passes unconditionally, which is exactly what this check exists to
        # catch. The previous version did `git stash; git checkout main`, which cannot work on a PR
        # merge ref.
        git fetch origin main
        git worktree add --detach "$RUNNER_TEMP/api-base-wt" origin/main
        dotnet publish "$RUNNER_TEMP/api-base-wt/src/SecretsManager.Vault/SecretsManager.Vault.csproj" \
          -c Release -o "$RUNNER_TEMP/api-base"

        dotnet "$RUNNER_TEMP/api-checker/ApiCompatChecker.dll" \
          "$RUNNER_TEMP/api-base" \
          "$RUNNER_TEMP/api-current"

        git worktree remove --force "$RUNNER_TEMP/api-base-wt" || true

    - name: Check formatting
      run: dotnet format --verify-no-changes --no-restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Pack NuGet packages
      run: dotnet pack --no-build -c Release --output ./nupkg

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: |
          ./nupkg/*.nupkg
          ./nupkg/*.snupkg
        retention-days: 7

  unit-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Run unit tests
      run: >-
        dotnet test
        --no-build
        -c Release
        --filter "FullyQualifiedName~SecretsManager.Tests"
        --collect:"XPlat Code Coverage"
        --results-directory ./test-results

    - name: Upload coverage to Codecov
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      uses: codecov/codecov-action@v7
      with:
        directory: ./test-results
        flags: unittests
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Run integration tests
      run: >-
        dotnet test
        --no-build
        -c Release
        --filter "FullyQualifiedName~SecretsManager.IntegrationTests"
