name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore

    # DISABLED: API compatibility check moved to PR #39
    #     - name: Check API compatibility
      run: |
        dotnet build tools/ApiCompatChecker/ApiCompatChecker.csproj -c Release --no-restore
        dotnet build src/SecretsManager.Vault/SecretsManager.Vault.csproj -c Release --no-restore

        # Save current branch assemblies, then build main for comparison
        mkdir -p /tmp/api-base
        cp src/SecretsManager.Vault/bin/Release/net10.0/SecretsManager.Vault.dll /tmp/api-base/
        cp src/SecretsManager.Vault/bin/Release/net10.0/SecretsManager.dll /tmp/api-base/ 2>/dev/null || true

        git stash
        git checkout main
        dotnet restore SecretsManager.sln
        dotnet build src/SecretsManager.Vault/SecretsManager.Vault.csproj -c Release --no-restore

        # Compare main (base) against current branch (current)
        dotnet tools/ApiCompatChecker/bin/Release/net10.0/ApiCompatChecker.dll \
          "/tmp/api-base" \
          "src/SecretsManager.Vault/bin/Release/net10.0"

        # Restore the PR branch
        git checkout -
        git stash pop

    - name: Check formatting
      run: dotnet format --verify-no-changes --no-restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Run unit tests with coverage
      run: >-
        dotnet test
        --no-build
        -c Release
        --collect:"XPlat Code Coverage"
        --results-directory ./test-results

    - name: Upload coverage to Codecov
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      uses: codecov/codecov-action@v7
      with:
        directory: ./test-results
        flags: unittests
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Pack NuGet packages
      run: dotnet pack --no-build -c Release --output ./nupkg

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: ./nupkg/*.nupkg
        retention-days: 7
