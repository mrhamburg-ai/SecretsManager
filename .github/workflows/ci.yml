name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore

    - name: Check API compatibility
      run: |
        # Build the checker tool and current branch assemblies
        dotnet build tools/ApiCompatChecker/ApiCompatChecker.csproj -c Release --no-restore
        dotnet build src/SecretsManager.Vault/SecretsManager.Vault.csproj -c Release --no-restore

        # Save current branch assemblies as the "current" set
        mkdir -p /tmp/api-current
        cp src/SecretsManager.Vault/bin/Release/net10.0/SecretsManager.Vault.dll /tmp/api-current/
        cp src/SecretsManager.Vault/bin/Release/net10.0/SecretsManager.dll /tmp/api-current/ 2>/dev/null || true

        # Checkout main and build it as the "base" set
        git fetch origin main
        git checkout origin/main --detach
        dotnet restore SecretsManager.sln
        dotnet build src/SecretsManager.Vault/SecretsManager.Vault.csproj -c Release --no-restore

        # Compare: main (base) vs current branch (current)
        dotnet tools/ApiCompatChecker/bin/Release/net10.0/ApiCompatChecker.dll \
          "src/SecretsManager.Vault/bin/Release/net10.0" \
          "/tmp/api-current"

        # Return to the PR branch
        git checkout -

    - name: Check formatting
      run: dotnet format --verify-no-changes --no-restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Run unit tests with coverage
      run: >-
        dotnet test
        --no-build
        -c Release
        --collect:"XPlat Code Coverage"
        --results-directory ./test-results

    - name: Upload coverage to Codecov
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      uses: codecov/codecov-action@v7
      with:
        directory: ./test-results
        flags: unittests
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Pack NuGet packages
      run: dotnet pack --no-build -c Release --output ./nupkg

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: ./nupkg/*.nupkg
        retention-days: 7
